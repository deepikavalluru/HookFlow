services:

  hookflow-db:
    image: postgres:18
    container_name: hookflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - hookflow-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  hookflow-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hookflow-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8082:8080"
    depends_on:
      hookflow-db:
        condition: service_healthy

  hookflow-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hookflow-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - hookflow-backend

volumes:
  hookflow-postgres-data:
    external: true