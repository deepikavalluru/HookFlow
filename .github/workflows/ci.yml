name: HookFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:

  # Backend testing
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: hookflow_test
          POSTGRES_USER: hookflow_user
          POSTGRES_PASSWORD: hookflow_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hookflow_user -d hookflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_PROFILES_ACTIVE: test
      DB_TEST_URL: jdbc:postgresql://localhost:5432/hookflow_test
      DB_USERNAME: hookflow_user
      DB_PASSWORD: hookflow_test_password
      JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify database configuration
        run: |
          echo "Checking database configuration..."
          test -n "$DB_TEST_URL" && echo "DB__TEST_URL is configured" || exit 1
          test -n "$DB_USERNAME" && echo "DB_USERNAME is configured" || exit 1
          test -n "$DB_PASSWORD" && echo "DB_PASSWORD is configured" || exit 1
          test -n "$JWT_SECRET" && echo "JWT_SECRET is configured" || exit 1

      - name: Run backend tests
        run: mvn -B verify


  # Frontend build
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build


  # Docker image builds
  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t hookflow-backend:ci .

      - name: Build frontend image
        run: docker build -t hookflow-frontend:ci ./frontend